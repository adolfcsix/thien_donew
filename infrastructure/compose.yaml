services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thiendo
      POSTGRES_PASSWORD: thiendo_dev
      POSTGRES_DB: thiendo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thiendo -d thiendo"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - thiendo_pg:/var/lib/postgresql/data
volumes:
  thiendo_pg: {}
