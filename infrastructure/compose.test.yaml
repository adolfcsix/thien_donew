# Isolated, disposable test DB. NOT the development/production volume.
# Start: docker compose -f infrastructure/compose.test.yaml up -d
# Port 5433 is bound only to localhost. NEVER use real customer data here.
services:
  postgres-test:
    image: postgres:16-alpine
    restart: 'no'
    environment:
      POSTGRES_USER: thiendo_test
      POSTGRES_PASSWORD: local_only_test
      POSTGRES_DB: thiendo_test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thiendo_test -d thiendo_test']
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - thiendo_pg_test:/var/lib/postgresql/data
volumes:
  thiendo_pg_test: {}
