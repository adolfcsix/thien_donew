worker_processes auto;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 resolver 127.0.0.11 valid=10s ipv6=off;
 # Caddy has a fixed private address; no other X-Forwarded-For sender is trusted.
 set_real_ip_from 172.30.240.2;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 map $uri $auth_key {
  default "";
  ~^/api/auth/(login|register|password|password/forgot|password/reset|google/start|google/verify|google/nonce)$ $binary_remote_addr;
 }
 limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
 limit_req_zone $auth_key zone=auth:10m rate=10r/m;
 limit_req_zone $server_name zone=global_api:1m rate=200r/s;
 limit_conn_zone $binary_remote_addr zone=connections:10m;
 log_format safe escape=json '{"event":"ingress","requestId":"$request_id","method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';
 access_log /dev/stdout safe;
 upstream api_backend { zone api 64k; server api:8080 resolve; keepalive 16; }
 upstream web_backend { zone web 64k; server web:3000 resolve; keepalive 16; }
 server {
  server_name gate;
  listen 8088;
  client_max_body_size 80k;
  client_body_timeout 10s;
  limit_conn connections 20;
  limit_req_status 429;
  error_page 429 = @rate_limited;
  location @rate_limited {
   default_type application/json;
   add_header Retry-After 60 always;
   add_header Cache-Control "no-store" always;
   add_header X-Request-ID $request_id always;
   return 429 '{"error":"Rate limit exceeded"}';
  }
  add_header X-Request-ID $request_id always;
  # Production artifact defense: never serve source/configuration/backup files.
  location ~* ^/(?:\.git|\.svn|\.env(?:\.[^/]+)?|node_modules|packages|apps|infrastructure)(?:/|$) { return 404; }
  location ~* (?:^|/)(?:package(?:-lock)?\.json|README\.md|HUONG_DAN\.md)$ { return 404; }
  location ~* \.(?:map|zip|sql|sqlite3?|bak|log|ts|tsx|cts|mts|cjs|mjs)$ { return 404; }
  location /api/ {
   limit_req zone=per_ip burst=40 nodelay;
   limit_req zone=auth burst=5 nodelay;
   limit_req zone=global_api burst=100 nodelay;
   # Keep API's per-route body budgets; do NOT raise the global 80 KiB ceiling.
   # proxy-api.conf already sets proxy_read_timeout (a duplicate directive prevents Nginx startup).
   location = /api/study/import { client_max_body_size 2m; include /etc/nginx/proxy-api.conf; }
   location = /api/auth/avatar { client_max_body_size 300k; include /etc/nginx/proxy-api.conf; }
   location = /api/forum/media { client_max_body_size 1m; include /etc/nginx/proxy-api.conf; }
   # CMS JSON editor accepts 256 KiB for create AND update.
   location = /api/van-kho/admin/documents { client_max_body_size 256k; include /etc/nginx/proxy-api.conf; }
   location ~ ^/api/van-kho/admin/documents/[^/]+$ { client_max_body_size 256k; include /etc/nginx/proxy-api.conf; }
   # Binary media is still authenticated/validated by NestJS; retain inherited rate limiting.
   location ~ ^/api/van-kho/admin/documents/[^/]+/images/(?:jpeg|png|webp)$ { client_max_body_size 5m; include /etc/nginx/proxy-api.conf; }
   location ~ ^/api/books/admin/[^/]+/assets/book/(?:pdf|epub)$ { client_max_body_size 24m; include /etc/nginx/proxy-api.conf; }
   location ~ ^/api/books/admin/[^/]+/assets/cover/(?:jpeg|png|webp)$ { client_max_body_size 5m; include /etc/nginx/proxy-api.conf; }
   include /etc/nginx/proxy-api.conf;
  }
  location / { proxy_pass http://web_backend; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header Connection ""; proxy_read_timeout 30s; }
 }
}
