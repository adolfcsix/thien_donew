name: THIEN DO - R39 late Zi study state and mobile accessibility
on:
  pull_request:
    paths:
      - '.github/workflows/tuvi-r39-study-state-ux.yml'
      - 'apps/web/src/features/chart/lib/late-zi-visibility.cjs'
      - 'apps/web/src/features/chart/components/chart-result.tsx'
      - 'apps/web/src/features/chart/components/late-zi-compare-panel.tsx'
      - 'apps/web/src/features/chart/components/late-zi-compare-panel.module.css'
      - 'tests/v111682-tuvi-r39-study-ux.test.cjs'
      - 'tests/helpers-late-zi-compare-browser.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tuvi-r39-study-state-ux.yml'
      - 'apps/web/src/features/chart/lib/late-zi-visibility.cjs'
      - 'apps/web/src/features/chart/components/chart-result.tsx'
      - 'apps/web/src/features/chart/components/late-zi-compare-panel.tsx'
      - 'apps/web/src/features/chart/components/late-zi-compare-panel.module.css'
      - 'tests/v111682-tuvi-r39-study-ux.test.cjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chart-study-state-and-mobile:
    name: Chart-scoped research disclosure and mobile comparison instructions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check lockfile, source, script syntax
        run: |
          npm run check:lockfile
          npm run check:source
          node --check apps/web/src/features/chart/lib/late-zi-visibility.cjs
          node --check tests/v111682-tuvi-r39-study-ux.test.cjs
          node --check tests/helpers-late-zi-compare-browser.cjs
      - name: Run independent R37 R38 R39 natal and view regression
        run: node --test tests/v111680-tuvi-r37-zi-scenario.test.cjs tests/v111681-tuvi-r38-compare-ui-model.test.cjs tests/v111682-tuvi-r39-study-ux.test.cjs
      - name: Typecheck web components
        run: npm run typecheck
      - name: Record release boundaries
        if: always()
        run: |
          echo '## R39 — nonpersistent late-Zi research UX' >> "$GITHUB_STEP_SUMMARY"
          echo 'The optional study is now bound to the exact calculated chart instance and closes on any recalculation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mobile study now describes moved-star markings and four-column horizontal table navigation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production account browser regression must validate 390px/1440px, minute changes, and aria-describedby.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No algorithm, chart saving, astrology school, timezone or catalog mapping changes (31/49).' >> "$GITHUB_STEP_SUMMARY"
