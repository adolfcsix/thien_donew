name: Thiên Đồ V11.161 — Billing and PayOS safety
on:
  push:
    branches: [audit/v11.161]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thiendo
          POSTGRES_PASSWORD: thiendo_ci_only
          POSTGRES_DB: thiendo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thiendo -d thiendo_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      CI: 'true'
      E2E_LOCAL_DB_CONFIRM: 'YES'
      DATABASE_URL: postgresql://thiendo:thiendo_ci_only@127.0.0.1:5432/thiendo_test
      WEB_ORIGIN: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:8080
      API_BASE_URL: http://127.0.0.1:8080
      API_HOST: 127.0.0.1
      API_PORT: '8080'
      COOKIE_SECURE: 'false'
      THIENDO_BROWSER_ACCEPTANCE: '0'
      # Deliberately NO PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY.
      # Payments remain disabled and no production money can move.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable source, workspace, architecture and migration chain
        run: |
          npm run check:lockfile
          npm run check:source
          npm run audit:architecture
          npm run audit:migration-chain
      - name: Install locked dependencies in fresh supported runner
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build Next.js plus NestJS
        run: |
          npm run typecheck
          npm run build
      - name: Finance and prior domain regression contracts
        run: |
          npm run test:finance:161
          node --test tests/v111601-admin-rank.test.cjs tests/v11159-v11160-tinh-canh.test.cjs tests/v11157-v11158-forum-security.test.cjs tests/v11156-van-kho-extended.test.cjs tests/v11155-library-contract.test.cjs
      - name: Full existing regression suite
        run: npm test
      - name: Validate disposable target, apply 28 migrations twice
        run: |
          npm run check:e2e-pre-migrate
          npm run db:migrate
          npm run db:migrate
          npm run check:e2e-db
      - name: Real PostgreSQL finance restrictions and dual-Admin refund schema
        run: node tests/v11161-finance-postgres.test.mjs
      - name: Real Next/Nest/PostgreSQL HTTP E2E
        run: bash infrastructure/scripts/run-ci-http.sh
      - name: Production-dependency vulnerability audit
        if: always()
        run: npm audit --omit=dev --audit-level=high
      - name: Save diagnostics only if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v11161-finance-ci-diagnostics
          path: |
            ${{ runner.temp }}/thiendo-ci-logs.*/*.log
          if-no-files-found: ignore
          retention-days: 5
