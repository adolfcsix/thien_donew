# No SSH/DNS changes until infrastructure is configured. Publication is opt-in.
name: Prepare immutable production images
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish candidate images to GHCR after all gates pass
permissions: {contents: read}
jobs:
  acceptance:
    uses: ./.github/workflows/production-acceptance.yml
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
  images:
    needs: [acceptance, dependency-audit]
    if: inputs.publish
    environment: production
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env: {REPOSITORY: '${{ github.repository }}'}
        run: |
          repository="${REPOSITORY,,}"
          echo "api=ghcr.io/$repository-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$repository-web" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: infrastructure/production/Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.api }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: infrastructure/production/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
      - name: Save immutable candidate manifest
        env:
          API_REF: '${{ steps.names.outputs.api }}@${{ steps.api.outputs.digest }}'
          WEB_REF: '${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}'
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$API_REF" "$WEB_REF" > release.env
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.env
          retention-days: 30
