name: THIEN DO - R33 1989 calendar and Zi Wei root-cause
on:
  pull_request:
    paths:
      - '.github/workflows/tuvi-1989-root-cause.yml'
      - 'infrastructure/scripts/tuvi-r33-*'
      - 'tests/v111676-tuvi-1989-root-cause-diagnostics.test.cjs'
      - 'packages/astrology-engine/src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tuvi-1989-root-cause.yml'
      - 'infrastructure/scripts/tuvi-r33-*'
      - 'tests/v111676-tuvi-1989-root-cause-diagnostics.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-1989-source-diagnostics:
    name: Reproduce exact 1989 lunar/Cuc/Star roots from 30 source charts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Thiên Đồ
        uses: actions/checkout@v4
      - name: Checkout immutable reference SHA
        uses: actions/checkout@v4
        with:
          repository: Renhuai123/ziwei-doushu
          ref: 7922285d947b36610e7e31c232d8f1e2a0d0871d
          path: reference-ziwei
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Thiên Đồ dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Install source dependencies from lockfile
        working-directory: reference-ziwei
        run: npm ci --no-audit --no-fund
      - name: Execute exact source chart and detectors for 30 calendar-control cases
        run: |
          cp infrastructure/scripts/tuvi-r33-source-root-cause-probe.ts.template reference-ziwei/.thiendo-r33-root-cause.ts
          cd reference-ziwei
          ./node_modules/.bin/tsx .thiendo-r33-root-cause.ts
      - name: Execute reference library timezone matrix (three isolated runtimes)
        run: |
          cp infrastructure/scripts/tuvi-r33-r58-timezone-calendar-probe.ts.template reference-ziwei/.thiendo-r58-calendar-probe.ts
          cd reference-ziwei
          TZ=UTC ./node_modules/.bin/tsx .thiendo-r58-calendar-probe.ts
          TZ=Asia/Ho_Chi_Minh ./node_modules/.bin/tsx .thiendo-r58-calendar-probe.ts
          TZ=Asia/Shanghai ./node_modules/.bin/tsx .thiendo-r58-calendar-probe.ts
      - name: Execute pinned lunar library internal boundary probe
        run: |
          cp infrastructure/scripts/tuvi-r33-r59-pinned-lunar-boundary-probe.ts.template reference-ziwei/.thiendo-r59-lunar-internals.ts
          cd reference-ziwei
          TZ=UTC ./node_modules/.bin/tsx .thiendo-r59-lunar-internals.ts
      - name: Verify original source metadata, local chart and divergence classification
        env:
          THIENDO_R33_REQUIRE_GENUINE: '1'
        run: |
          node --test tests/v111676-tuvi-1989-root-cause-diagnostics.test.cjs
          node infrastructure/scripts/tuvi-r33-evaluate-root-cause.cjs .r33-source-1989-root-cause-observations.json
          node infrastructure/scripts/tuvi-r33-r57-lunar-day-counterfactual.cjs .r33-source-1989-root-cause-observations.json
          node infrastructure/scripts/tuvi-r33-r58-evaluate-timezone-calendar.cjs .r58-source-tz-UTC.json .r58-source-tz-Asia_Ho_Chi_Minh.json .r58-source-tz-Asia_Shanghai.json
          node infrastructure/scripts/tuvi-r33-r59-evaluate-lunar-boundary-internals.cjs .r59-source-lunar-boundary-internals.json
      - name: Note source-only evidence boundary
        if: always()
        run: |
          echo '## R33 1989 calendar and chart root-cause' >> "$GITHUB_STEP_SUMMARY"
          echo '30 synthetic source charts: years 1988,1989,1990 and dates August 14-16 1989, 3 hours and 2 genders.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact source: Renhuai123/ziwei-doushu@7922285d947b36610e7e31c232d8f1e2a0d0871d, iztro@2.6.1.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A difference between engines is recorded as diagnostic data, NOT treated as a failure or silently changed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No astrology engine changes, no semantic parity, no promotion from 31/49 mapped classical conditions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'R57: 30 real source cases with isolated local lunar-input counterfactual; a reproduced coordinate does NOT prove calendar-school equivalence or authorize changing user charts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'R58: three source-library TZ runtime experiments; process TZ behavior is not proof of calendar-school policy or authorization to switch Thiên Đồ charts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'R59: independently observe first Julian day of 1989 lunar month 7 and a library eight-hour calculation term; full astronomy and calendar-school policy NOT established.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain detailed source and comparison JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thien-do-r33-1989-calendar-root-cause
          path: |
            .r33-source-1989-root-cause-observations.json
            .r33-1989-root-cause-report.json
            .r57-source-lunar-day-counterfactual.json
            .r58-source-tz-UTC.json
            .r58-source-tz-Asia_Ho_Chi_Minh.json
            .r58-source-tz-Asia_Shanghai.json
            .r58-pinned-timezone-calendar-matrix.json
            .r59-source-lunar-boundary-internals.json
            .r59-pinned-lunar-julian-boundary-audit.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
